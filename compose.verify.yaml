# Disposable M2-D validation project. Never use with production data.
name: aftercare-m2d-verify
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aftercare_m2d
      POSTGRES_USER: aftercare
      POSTGRES_PASSWORD: aftercare
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftercare -d aftercare_m2d"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
  qdrant:
    image: qdrant/qdrant:v1.15.4
  api:
    build: ./apps/api
    environment:
      AFTERCARE_DATABASE_URL: postgresql://aftercare:aftercare@postgres:5432/aftercare_m2d
      AFTERCARE_REDIS_URL: redis://redis:6379/0
      AFTERCARE_QDRANT_URL: http://qdrant:6333
      AFTERCARE_CORS_ORIGINS: http://localhost:15173
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: http://localhost:18000
    ports: ["127.0.0.1:15173:80"]
volumes:
  postgres_data:
